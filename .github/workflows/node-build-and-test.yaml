name: Node.js CI build and test
description: Build and test npm node.js repositories in current and LTS. Needs `npm ci` and `npm test` in place.

on:
  workflow_call:
    inputs:
      test_versions:
        description: 'Versiones sobre las cuales testear ej: "22.x 24.x 26.x". Vacío: las predeterminadas. ''no'': no correr los tests (igual se hace el build en coverage_version)'
        type: string
        required: false
        default: ''
      coverage_version:
        description: 'Version de node en la que se corre test-ci y se reporta coverage. Tiene que figurar en la lista de versiones testeadas'
        type: string
        required: false
        default: ''
      postgres:
        description: "PostgreSQL para los tests, accesible con las variables PG*. Vacío o 'no': sin PostgreSQL. 'lts': el que viene instalado en el runner. Otro valor: esa versión de la imagen oficial de Docker (por ejemplo '17')"
        type: string
        required: false
        default: ''

env:
  coverage_version: ${{ inputs.coverage_version || '26.x' }}
  TRAVIS: 'GHA'

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      node-versions: ${{ steps.filter.outputs.node-versions }}
      run-tests: ${{ steps.filter.outputs.run-tests }}
    steps:
    - uses: actions/checkout@v7
    - name: Filtrar las versiones que no acepta engines.node
      id: filter
      env:
        all_versions: '22.x 24.x 26.x'
        test_versions: ${{ inputs.test_versions }}
      run: |
        node -e '
          const path = require("path");
          const nodeDir = path.dirname(process.execPath);
          const npmModules = [
            path.join(nodeDir, "..", "lib", "node_modules", "npm", "node_modules"),
            path.join(nodeDir, "node_modules", "npm", "node_modules"),
          ];
          const semver = require(require.resolve("semver", {paths: npmModules}));
          const output = (name, value) => require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `${name}=${value}\n`);
          const coverage_version = process.env.coverage_version;
          if (process.env.test_versions == "no") {
            console.log(`test_versions: no -> no se corren los tests, solo el build en: ${coverage_version}`);
            output("node-versions", JSON.stringify([coverage_version]));
            output("run-tests", "no");
            process.exit(0);
          }
          const version_list = process.env.test_versions || process.env.all_versions;
          const all = version_list.split(" ");
          const engines = require("./package.json").engines?.node;
          const kept = engines ? all.filter(v => semver.intersects(v, engines)) : all;
          if (!kept.length) {
            console.error(`Error: engines.node (${engines}) no acepta ninguna de las versiones de la matriz (${all.join(", ")}).`);
            process.exit(1);
          }
          if (!kept.includes(coverage_version)) {
            console.error(`Error: coverage_version (${coverage_version}) no figura entre las versiones que se testean (${kept.join(", ")}).`);
            process.exit(1);
          }
          console.log(`engines.node: ${engines ?? "(no declarado)"} -> se prueba en: ${kept.join(", ")}`);
          output("node-versions", JSON.stringify(kept));
          output("run-tests", "si");
        '

  build:

    needs: matrix

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ${{ fromJSON(needs.matrix.outputs.node-versions) }}

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - name: Start PostgreSQL
      if: inputs.postgres != '' && inputs.postgres != 'no'
      env:
        postgres_version: ${{ inputs.postgres }}
      run: |
        if [ "$postgres_version" = "lts" ]; then
          sudo systemctl start postgresql.service
          pg_isready --timeout=30
          sudo -u postgres psql -v ON_ERROR_STOP=1 \
            -c "create role test_super login superuser password 'super_pass'" \
            -c "create database test_db owner test_super"
        else
          docker run --detach --publish 5432:5432 --env POSTGRES_USER=test_super --env POSTGRES_PASSWORD=super_pass --env POSTGRES_DB=test_db "postgres:$postgres_version"
          for attempt in $(seq 1 60); do pg_isready --host=localhost --quiet && break; sleep 1; done
        fi
        PGPASSWORD=super_pass psql --host=localhost --username=test_super --dbname=test_db -v ON_ERROR_STOP=1 \
          -c "create role test_user login password 'test_pass'" \
          -c "grant all on database test_db to test_user" \
          -c "grant pg_read_server_files to test_user"
        PGPASSWORD=test_pass psql --host=localhost --username=test_user --dbname=test_db --command='select version()'
        {
          echo "PGHOST=localhost"
          echo "PGUSER=test_user"
          echo "PGPASSWORD=test_pass"
          echo "PGDATABASE=test_db"
        } >> "$GITHUB_ENV"
    - run: npm ci
    - run: npm run build --if-present
    - name: Test
      if: needs.matrix.outputs.run-tests == 'si' && matrix.node-version != env.coverage_version
      run: npm test
    - name: Test with coverage
      if: needs.matrix.outputs.run-tests == 'si' && matrix.node-version == env.coverage_version
      run: npm run test-ci
    - name: Coveralls
      if: needs.matrix.outputs.run-tests == 'si' && matrix.node-version == env.coverage_version
      uses: coverallsapp/github-action@master
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
