name: Node.js CI build and test
description: Build and test npm node.js repositories in current and LTS. Needs `npm ci` and `npm test` in place.

on:
  workflow_call:
    inputs:
      coverage_version:
        description: 'Version de node en la que se corre test-ci y se reporta coverage'
        type: string
        required: false
        default: '26.x'

env:
  coverage_version: ${{ inputs.coverage_version }}
  TRAVIS: 'GHA'

jobs:
  build:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]

    steps:
    - uses: actions/checkout@v7
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - run: npm run build --if-present
    - name: Test
      if: matrix.node-version != env.coverage_version
      run: npm test
    - name: Test with coverage
      if: matrix.node-version == env.coverage_version
      run: npm run test-ci
    - name: Coveralls
      if: matrix.node-version == env.coverage_version
      uses: coverallsapp/github-action@master
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
