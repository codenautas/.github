name: QA control
description: Run qa-control on the project. Needs `npm ci` in place.

on:
  workflow_call:

jobs:

  qa:
    runs-on: ubuntu-latest
    steps:

    - uses: actions/checkout@v6

    - name: Use Node.js 24.x
      uses: actions/setup-node@v6
      with:
        node-version: 24.x
        cache: 'npm'

    - run: npm ci

    - name: Run QA control
      run: |
        if [ -f bin/qa-control-run.js ]; then
          node bin/qa-control-run.js . --repo-is $GITHUB_REPOSITORY
        else
          npx qa-control . --repo-is $GITHUB_REPOSITORY
        fi

    - name: npm audit
      run: npm audit --omit=dev
