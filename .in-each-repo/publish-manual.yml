name: Publish (manual)

on:
  workflow_dispatch:
    inputs:
      publish_without_testing:
        description: 'Publicar sin correr los tests'
        type: boolean
        required: false
        default: false

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    uses: codenautas/.github/.github/workflows/npm-publish-new-version.yaml@v2
    with:
      node_version: '24.x'
      publish_without_testing: ${{ inputs.publish_without_testing }}
      postgres: ''
      create-tag: true
